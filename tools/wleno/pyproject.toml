[project]
name = "wleno"
version = "0.1.0"
description = "WlEno Wi-Fi/TCP 보드 시뮬레이터"
requires-python = ">=3.10"
dependencies = ["pygame-ce>=2.5"]

[project.scripts]
main = "sim:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["sim.py"]
