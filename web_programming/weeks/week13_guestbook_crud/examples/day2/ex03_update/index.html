<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>방명록 글 수정</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/w3-css/4.1.0/w3.min.css">
  <script src="load-config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="w3-content w3-padding">
    <h1>방명록 글 수정</h1>
    <p id="config-status" role="status"></p>
    <form id="update-form">
      <fieldset id="fields" class="w3-border-0 w3-padding-0" disabled>
        <p><label for="entry">수정할 글</label>
          <select class="w3-select w3-border" id="entry" required>
            <option value="" selected disabled>수정할 글을 선택하세요</option>
          </select></p>
        <p><label for="message">새 메시지</label>
          <textarea class="w3-input w3-border" id="message" maxlength="500" rows="3" required></textarea></p>
        <button class="w3-button w3-teal" id="update" type="submit">수정</button>
      </fieldset>
    </form>
    <p id="status" role="status"></p>
  </main>
</body>
</html>
