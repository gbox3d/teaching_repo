<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex06 text-align</title>
    <style>
        .box {
            background-color: lightskyblue;   /* 상자 폭이 보이게 칠한다(이 파일의 주제는 아니다) */
        }
        .center {
            text-align: center;
        }
        .right {
            text-align: right;
        }
    </style>
</head>
<body>
    <p>1. 기본 (왼쪽)</p>
    <div class="box">글자</div>
    <p>2. text-align: center</p>
    <div class="box center">글자</div>
    <p>3. text-align: right</p>
    <div class="box right">글자</div>
    <p>text-align 은 상자 안의 글자를 가로로 어디에 둘지 정한다. 글자를 담은 상자에 쓴다.</p>
</body>
</html>
