<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex05 margin auto</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <p>1. 기본 → 왼쪽에 붙는다</p>
    <div class="box">상자 1</div>
    <p>2. margin-left: auto</p>
    <div class="box left-auto">상자 2</div>
    <p>3. margin-left: auto + margin-right: auto</p>
    <div class="box both-auto">상자 3</div>
    <p>4. margin: 0 auto</p>
    <div class="box short">상자 4</div>
    <p>auto 는 "남는 폭을 가져간다"는 값이다. 양쪽이 auto 면 반씩 가져가서 상자가 가운데에 선다.</p>
</body>
</html>
