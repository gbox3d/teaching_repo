<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex03 box model</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <p>1. 기본</p>
    <div class="frame">frame<div class="box">box</div>frame</div>
    <p>2. padding 16px</p>
    <div class="frame">frame<div class="box pad">box</div>frame</div>
    <p>3. border 4px</p>
    <div class="frame">frame<div class="box bd">box</div>frame</div>
    <p>4. margin 16px</p>
    <div class="frame">frame<div class="box mg">box</div>frame</div>
    <p>5. padding + border + margin</p>
    <div class="frame">frame<div class="box pad bd mg">box</div>frame</div>
    <p>안쪽 여백 · 테두리 · 바깥 여백은 서로 다른 층이다. F12 › Elements › Styles 맨 아래 상자 그림에서 네 값을 볼 수 있다.</p>
</body>
</html>
