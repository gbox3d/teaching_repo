<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex04 width</title>
    <style>
        .box {
            background-color: lightgreen;   /* 폭이 보이게 칠한다(이 파일의 주제는 아니다) */
        }
        .w {
            width: 640px;               /* 창이 좁아져도 640px, 삐져나간다 */
        }
        .mw {
            max-width: 640px;           /* 640px 까지만, 창이 좁으면 같이 줄어든다 */
        }
    </style>
</head>
<body>
    <p>1. 기본 → 부모(body) 폭 전부</p>
    <div class="box">상자 1</div>
    <p>2. width: 640px</p>
    <div class="box w">상자 2</div>
    <p>3. max-width: 640px</p>
    <div class="box mw">상자 3</div>
    <p>창 폭을 400px 까지 천천히 줄여 본다. 2번만 삐져나가 가로 스크롤이 생긴다.</p>
</body>
</html>
