<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex01 selector</title>
    <style>
        p {
            color: blue;            /* 태그 선택자: 모든 p */
        }
        .red {
            color: red;             /* 클래스 선택자: class="red" 인 것만, 태그는 상관없다 */
        }
        nav a {
            color: green;           /* 자손 선택자: nav 안에 있는 a 만 */
        }
        /* 아래 주석을 풀면 모든 p 가 회색이 된다. 같은 선택자를 두 번 쓰면 뒤에 쓴 것이 이긴다 */
        /* p { color: gray; } */
    </style>
</head>
<body>
    <p>1. p 태그 → 파랑</p>
    <p class="red">2. p 이면서 class="red" → 빨강 (클래스가 태그를 이긴다)</p>
    <div class="red">3. div 이면서 class="red" → 빨강 (클래스는 태그와 상관없다)</div>
    <p class="Red">4. class="Red" → 파랑 (대소문자가 다르면 다른 이름, 선택자가 안 맞으면 아무 일도 없다)</p>
    <nav>
        <a href="#">5. nav 안의 a → 초록</a>
    </nav>
    <a href="#">6. nav 밖의 a → 기본색</a>
</body>
</html>
