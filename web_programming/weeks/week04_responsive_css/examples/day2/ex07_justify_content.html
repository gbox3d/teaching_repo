<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex07 justify-content</title>
    <style>
        body {
            background-color: #222222;
            color: white;
            font-family: sans-serif;
        }
        .frame {
            display: flex;
            border: 1px solid white;
            width: 300px;
            height: 48px;
            margin-bottom: 8px;
            /* flex-direction: column; */   /* 주석을 풀면 다섯 개가 전부 세로 방향으로 움직인다 */
        }
        .box {
            width: 48px;
            height: 32px;
            margin: 4px;
            background-color: dodgerblue;
            text-align: center;
            line-height: 32px;
        }
        /* 주축(row 면 가로) 위에서 남는 공간을 어떻게 나누나 */
        .start   { justify-content: flex-start; }    /* 기본값: 앞에 모은다 */
        .center  { justify-content: center; }        /* 가운데 모은다 */
        .end     { justify-content: flex-end; }      /* 뒤에 모은다 */
        .between { justify-content: space-between; } /* 양 끝에 붙이고 사이를 벌린다 */
        .around  { justify-content: space-around; }  /* 상자마다 양옆에 같은 여백 */
        /* .evenly { justify-content: space-evenly; } */ /* 모든 간격이 같다 */
    </style>
</head>
<body>
    <p>1. flex-start (기본값)</p>
    <div class="frame start">
        <div class="box">1</div><div class="box">2</div><div class="box">3</div>
    </div>
    <p>2. center</p>
    <div class="frame center">
        <div class="box">1</div><div class="box">2</div><div class="box">3</div>
    </div>
    <p>3. flex-end</p>
    <div class="frame end">
        <div class="box">1</div><div class="box">2</div><div class="box">3</div>
    </div>
    <p>4. space-between</p>
    <div class="frame between">
        <div class="box">1</div><div class="box">2</div><div class="box">3</div>
    </div>
    <p>5. space-around</p>
    <div class="frame around">
        <div class="box">1</div><div class="box">2</div><div class="box">3</div>
    </div>
</body>
</html>
