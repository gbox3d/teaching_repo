<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex08 align-items</title>
    <style>
        body {
            background-color: #222222;
            color: white;
            font-family: sans-serif;
        }
        .frame {
            display: flex;
            border: 1px solid white;
            width: 300px;
            height: 120px;
            margin-bottom: 8px;
            /* flex-direction: column; */   /* 주석을 풀면 네 개가 전부 가로 방향으로 움직인다 */
        }
        .box {
            width: 48px;                    /* 높이는 정하지 않았다 */
            margin: 4px;
            padding: 8px 0;
            background-color: dodgerblue;
            text-align: center;
        }
        /* 교차축(row 면 세로) 위에서 자식을 어디에 두나 */
        .stretch { align-items: stretch; }     /* 기본값: 높이를 안 정한 자식은 끝까지 늘어난다 */
        .start   { align-items: flex-start; }  /* 위 */
        .center  { align-items: center; }      /* 세로 가운데 */
        .end     { align-items: flex-end; }    /* 아래 */
    </style>
</head>
<body>
    <p>1. stretch (기본값)</p>
    <div class="frame stretch">
        <div class="box">1</div><div class="box">2</div><div class="box">3</div>
    </div>
    <p>2. flex-start</p>
    <div class="frame start">
        <div class="box">1</div><div class="box">2</div><div class="box">3</div>
    </div>
    <p>3. center</p>
    <div class="frame center">
        <div class="box">1</div><div class="box">2</div><div class="box">3</div>
    </div>
    <p>4. flex-end</p>
    <div class="frame end">
        <div class="box">1</div><div class="box">2</div><div class="box">3</div>
    </div>
    <p>ex05 에서 안 되던 세로 가운데가 여기서 된다. justify-content 는 주축, align-items 는 교차축.</p>
</body>
</html>
