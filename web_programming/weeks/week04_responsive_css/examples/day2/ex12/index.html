<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex12 flex grow</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <p>1. 기본 — 남는 공간 유지</p>
    <div class="frame">
        <div class="c1">상자 1</div><div class="c2">상자 2</div><div class="c3">상자 3</div>
    </div>
    <p>2. 가운데만 flex: 1</p>
    <div class="frame">
        <div class="c1">상자 1</div><div class="c2 grow">상자 2</div><div class="c3">상자 3</div>
    </div>
    <p>3. 셋 다 flex: 1 → 같은 폭</p>
    <div class="frame">
        <div class="c1 grow">상자 1</div><div class="c2 grow">상자 2</div><div class="c3 grow">상자 3</div>
    </div>
</body>
</html>
