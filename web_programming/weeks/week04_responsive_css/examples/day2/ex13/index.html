<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex13 media</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <p>1. @media 규칙이 있는 상자 — 창을 600px 보다 좁히면 주황</p>
    <div class="with-media">상자 1</div>
    <p>2. @media 규칙이 없는 상자 — 창을 아무리 좁혀도 하늘색</p>
    <div class="without-media">상자 2</div>
    <p>F12 › 기기 모드(Ctrl+Shift+M) 에서 폭을 375 로 바꿔 본다. 1번만 색이 바뀐다.</p>
</body>
</html>
