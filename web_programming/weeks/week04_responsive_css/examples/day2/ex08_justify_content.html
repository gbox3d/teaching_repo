<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex08 justify-content</title>
    <style>
        .frame {
            display: flex;                  /* ex07: 자식이 가로(→)로 선다 */
            background-color: lightgray;    /* 회색이 보이면 남는 공간이다 */
        }
        /* 자식을 구분하려고 배경색만 칠한다(이 파일의 주제는 아니다) */
        .c1 { background-color: gold; }
        .c2 { background-color: lightskyblue; }
        .c3 { background-color: lightgreen; }

        /* 주축(가로) 위에서 남는 공간을 어떻게 나누나 */
        .start   { justify-content: flex-start; }    /* 기본값: 앞에 모은다 */
        .center  { justify-content: center; }        /* 가운데 모은다 */
        .end     { justify-content: flex-end; }      /* 뒤에 모은다 */
        .between { justify-content: space-between; } /* 양 끝에 붙이고 사이를 벌린다 */
        .around  { justify-content: space-around; }  /* 상자마다 양옆에 같은 여백 */
        /* .evenly { justify-content: space-evenly; } */ /* 모든 간격이 같다 */
    </style>
</head>
<body>
    <p>1. flex-start (기본값)</p>
    <div class="frame start">
        <div class="c1">상자 1</div><div class="c2">상자 2</div><div class="c3">상자 3</div>
    </div>
    <p>2. center</p>
    <div class="frame center">
        <div class="c1">상자 1</div><div class="c2">상자 2</div><div class="c3">상자 3</div>
    </div>
    <p>3. flex-end</p>
    <div class="frame end">
        <div class="c1">상자 1</div><div class="c2">상자 2</div><div class="c3">상자 3</div>
    </div>
    <p>4. space-between</p>
    <div class="frame between">
        <div class="c1">상자 1</div><div class="c2">상자 2</div><div class="c3">상자 3</div>
    </div>
    <p>5. space-around</p>
    <div class="frame around">
        <div class="c1">상자 1</div><div class="c2">상자 2</div><div class="c3">상자 3</div>
    </div>
    <p>justify-content 는 주축 위의 남는 공간(회색)을 어디에 둘지 정한다. 부모에 쓴다.</p>
</body>
</html>
