<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex09 align-items</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <p>1. stretch (기본값)</p>
    <div class="frame stretch">
        <div class="c1">상자 1</div><div class="c2">상자 2</div><div class="c3">상자 3</div>
    </div>
    <p>2. flex-start</p>
    <div class="frame start">
        <div class="c1">상자 1</div><div class="c2">상자 2</div><div class="c3">상자 3</div>
    </div>
    <p>3. center</p>
    <div class="frame center">
        <div class="c1">상자 1</div><div class="c2">상자 2</div><div class="c3">상자 3</div>
    </div>
    <p>4. flex-end</p>
    <div class="frame end">
        <div class="c1">상자 1</div><div class="c2">상자 2</div><div class="c3">상자 3</div>
    </div>
    <p>align-items 는 교차축(가로로 선 자식에게는 세로)에서 자식을 어디에 둘지 정한다. 부모에 쓴다.</p>
</body>
</html>
