<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex12 position</title>
    <style>
        body {
            background-color: #222222;
            color: white;
            font-family: sans-serif;
        }
        .frame {
            position: relative;         /* absolute 자식의 기준점이 된다 */
            border: 1px solid white;
            width: 300px;
            height: 100px;
            margin-bottom: 8px;
        }
        .box {
            width: 64px;
            height: 32px;
            background-color: dodgerblue;
            text-align: center;
            line-height: 32px;
        }
        .relative {
            position: relative;         /* 원래 자리에서 밀어낸다. 자리는 남는다 */
            top: 20px;
            left: 40px;
        }
        .absolute {
            position: absolute;         /* 흐름에서 빠져 frame 의 모서리 기준으로 놓인다 */
            right: 4px;
            bottom: 4px;
        }
    </style>
</head>
<body>
    <p>1. static (기본값)</p>
    <div class="frame">
        <div class="box">A</div><div class="box">B</div>
    </div>
    <p>2. A 에 position: relative; top: 20px; left: 40px</p>
    <div class="frame">
        <div class="box relative">A</div><div class="box">B</div>
    </div>
    <p>3. A 에 position: absolute; right: 4px; bottom: 4px → B 가 A 자리로 올라온다</p>
    <div class="frame">
        <div class="box absolute">A</div><div class="box">B</div>
    </div>
</body>
</html>
