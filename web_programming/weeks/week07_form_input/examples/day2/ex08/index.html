<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex08 append</title>
    <script src="app.js" defer></script>
</head>
<body>
    <h1>ex08 바꾸기 vs 붙이기</h1>
    <p>칸의 글을 바꿔 가며 1번과 2번 버튼을 번갈아 누른다. 1번 자리와 그 아래 2번 목록에 줄이 몇 개 남는지 비교하고, F12 › Elements 에서 &lt;ul id="list"&gt; 안을 펼쳐 본다.</p>
    <div>
        <label for="text">글</label>
        <input id="text" type="text" value="student01: 안녕하세요">
    </div>
    <div>
        <button id="btn1">1. 바꾸기</button>
        <button id="btn2">2. 붙이기</button>
    </div>
    <div id="out1">1번 자리</div>
    <ul id="list"></ul>
</body>
</html>
