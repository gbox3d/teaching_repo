<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex05 empty</title>
    <script src="app.js" defer></script>
</head>
<body>
    <h1>ex05 빈값 검사와 return</h1>
    <p>칸을 비우거나 채워서 남기기를 누른다. F12 › Console 의 번호로 어디까지 실행됐는지 보고, 폼 아래의 안내 자리(처음에는 비어 있다)와 결과 자리를 본다.</p>
    <form id="form">
        <div>
            <label for="name">이름</label>
            <input id="name" type="text">
        </div>
        <div>
            <label for="message">메시지</label>
            <textarea id="message" rows="3"></textarea>
        </div>
        <button type="submit">남기기</button>
    </form>
    <div id="notice"></div>
    <div id="last">아직 남긴 글이 없습니다.</div>
</body>
</html>
