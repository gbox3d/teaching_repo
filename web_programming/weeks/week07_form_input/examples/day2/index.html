<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7주차 2일차 예제</title>
</head>
<body>
    <h1>7주차 2일차 예제: script 줄 하나만 켠다</h1>
    <p>이 파일 맨 아래 script 줄 네 개 중 <b>하나만</b> 주석 밖에 둔다. 저장 → 새로고침 → 화면과 F12 › Console 을 본다.</p>
    <p>예제 코드는 각 <code>exNN_*.js</code> 파일에 있다. 네 예제가 아래 폼을 함께 쓴다. 조립할 방명록 폼과 같은 모양이다.</p>

    <h2>예제가 쓰는 자리</h2>
    <form id="form">
        <div>
            <label for="name">이름</label>
            <input id="name" type="text">
        </div>
        <div>
            <label for="message">메시지</label>
            <textarea id="message" rows="3"></textarea>
        </div>
        <button type="submit">남기기</button>
    </form>
    <div id="notice"></div>
    <div id="last">아직 남긴 글이 없습니다.</div>

    <!-- 예제 고르기: 줄에 커서를 두고 Ctrl+/ (macOS ⌘+/) 를 누르면 주석이 켜지고 꺼진다. 한 줄만 켠다 -->
    <script src="ex04_reset_focus.js"></script>
    <!-- <script src="ex05_empty.js"></script> -->
    <!-- <script src="ex06_input.js"></script> -->
    <!-- <script src="ex07_pass_name.js"></script> -->
</body>
</html>
