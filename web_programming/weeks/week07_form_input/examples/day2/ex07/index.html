<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex07 pass name</title>
    <script src="app.js" defer></script>
</head>
<body>
    <h1>ex07 함수 이름만 맡기기</h1>
    <p>열면 칸 아래에 안내 문구가 보인다. 이름 칸에 한 글자를 치고 안내 자리를 본다. 새로고침하고 이번에는 메시지 칸에 쳐 본다. 이 예제는 Console 에 찍지 않는다.</p>
    <div>
        <label for="name">이름</label>
        <input id="name" type="text">
    </div>
    <div>
        <label for="message">메시지</label>
        <textarea id="message" rows="3"></textarea>
    </div>
    <div id="notice"></div>
</body>
</html>
