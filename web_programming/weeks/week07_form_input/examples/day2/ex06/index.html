<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex06 input</title>
    <script src="app.js" defer></script>
</head>
<body>
    <h1>ex06 input 이벤트: 글자가 바뀔 때마다</h1>
    <p>열면 칸 아래에 안내 문구가 보인다. 두 칸에 한 글자씩 쳐 본다. Backspace 로 지울 때도 F12 › Console 을 본다.</p>
    <div>
        <label for="name">이름</label>
        <input id="name" type="text">
    </div>
    <div>
        <label for="message">메시지</label>
        <textarea id="message" rows="3"></textarea>
    </div>
    <div id="notice"></div>
</body>
</html>
