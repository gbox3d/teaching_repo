<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ex02 W3.CSS 입력과 버튼</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/w3-css/4.1.0/w3.min.css">
    <script src="app.js" defer></script>
  </head>
  <body class="w3-container">
    <h1>ex02 입력과 버튼</h1>
    <form id="form">
      <p>
        <label for="name">이름</label>
        <input id="name" class="w3-input w3-border" type="text">
      </p>
      <p>
        <label for="message">메시지</label>
        <textarea id="message" class="w3-input w3-border" rows="3"></textarea>
      </p>
      <button class="w3-button w3-teal" type="submit">미리보기</button>
    </form>
    <p id="result" class="w3-responsive" aria-live="polite"></p>
  </body>
</html>
