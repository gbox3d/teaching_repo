<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex05 JSON 저장과 복원</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/w3-css/4.1.0/w3.min.css">
    <script src="app.js" defer></script>
</head>
<body class="w3-content w3-padding">
    <h1>ex05 JSON 저장과 복원</h1>
    <h2>저장할 배열</h2>
    <pre class="w3-responsive" id="source-json"></pre>
    <button class="w3-button w3-border w3-round" id="save-button" type="button">JSON 저장</button>
    <button class="w3-button w3-border w3-round" id="read-button" type="button">저장 원문 조회</button>
    <button class="w3-button w3-border w3-round" id="parse-button" type="button">JSON 복원</button>
    <button class="w3-button w3-border w3-round" id="remove-button" type="button">지우기</button>
    <h2>저장 원문</h2>
    <pre class="w3-responsive" id="stored-json">조회 전</pre>
    <h2>복원한 필드</h2>
    <ul class="w3-responsive" id="restored-items"></ul>
    <p id="status" role="status">대기</p>
</body>
</html>
