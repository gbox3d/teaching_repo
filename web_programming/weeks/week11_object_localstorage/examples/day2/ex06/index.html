<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex06 입력 폼 저장과 복원</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/w3-css/4.1.0/w3.min.css">
    <script src="app.js" defer></script>
</head>
<body class="w3-content w3-padding">
    <h1>ex06 입력 폼 저장과 복원</h1>
    <form id="entry-form">
        <label for="name">이름</label>
        <input class="w3-input w3-border w3-round" id="name" type="text">
        <label for="message">메시지</label>
        <textarea class="w3-input w3-border w3-round" id="message" rows="4"></textarea>
        <button class="w3-button w3-border w3-round" id="save-button" type="submit">저장</button>
        <button class="w3-button w3-border w3-round" id="load-button" type="button">불러오기</button>
        <button class="w3-button w3-border w3-round" id="remove-button" type="button">지우기</button>
    </form>
    <h2>저장한 JSON</h2>
    <pre class="w3-responsive" id="stored-json">조회 전</pre>
    <p id="status" role="status">대기</p>
</body>
</html>
