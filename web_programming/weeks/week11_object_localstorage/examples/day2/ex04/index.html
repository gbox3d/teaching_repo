<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex04 문자열 저장</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/w3-css/4.1.0/w3.min.css">
    <link rel="stylesheet" href="../../../../../shared/examples.css">
    <script src="app.js" defer></script>
</head>
<body class="w3-content teaching-example">
    <h1>ex04 문자열 저장</h1>
    <label for="memo">저장할 문자열</label>
    <input class="w3-input w3-border w3-round" id="memo" type="text">
    <button class="w3-button w3-border w3-round" id="save-button" type="button">저장</button>
    <button class="w3-button w3-border w3-round" id="load-button" type="button">불러오기</button>
    <button class="w3-button w3-border w3-round" id="remove-button" type="button">지우기</button>
    <h2>결과</h2>
    <pre id="result">조회 전</pre>
    <p id="status" role="status">대기</p>
</body>
</html>
