<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>사진 산책 상세</title>
  </head>
  <body>
    <header>
      <p><a href="index.html">Campus Together</a></p>
      <nav aria-label="주요 메뉴">
        <a href="index.html">활동 목록</a>
        <a href="write.html">새 활동 제안</a>
      </nav>
    </header>
    <main>
      <article>
        <h1>사진 산책</h1>
        <p>저녁빛을 관찰하며 캠퍼스를 한 바퀴 걷는 초보자 환영 모임입니다.</p>
        <dl>
          <dt>범주</dt>
          <dd>취미</dd>
          <dt>장소</dt>
          <dd>도서관 앞</dd>
          <dt>정원</dt>
          <dd>12명</dd>
        </dl>
        <section aria-labelledby="schedule-heading">
          <h2 id="schedule-heading">세부 일정</h2>
          <table>
            <caption>사진 산책의 시간별 진행</caption>
            <thead>
              <tr>
                <th scope="col">시간</th>
                <th scope="col">활동</th>
                <th scope="col">장소</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th scope="row"><time datetime="18:00">18:00</time></th>
                <td>모임과 안전 안내</td>
                <td>도서관 앞</td>
              </tr>
              <tr>
                <th scope="row"><time datetime="18:15">18:15</time></th>
                <td>캠퍼스 산책</td>
                <td>중앙 산책로</td>
              </tr>
            </tbody>
          </table>
        </section>
      </article>
      <p><a href="index.html">활동 목록으로 돌아가기</a></p>
    </main>
    <footer>
      <p>문의는 수업용 채널에서 받습니다.</p>
    </footer>
  </body>
</html>
