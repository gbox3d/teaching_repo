<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex06 compare</title>
</head>
<body>
    <h1>ex06 비교: 결과는 true 아니면 false</h1>
    <p>F12 › Console 에 1~6번이 찍힌다.</p>
    <script>
        console.log("1. 1 == '1' →", 1 == '1');          // 값만 맞춰 보고 같다고 한다
        console.log("2. 1 === '1' →", 1 === '1');        // 종류(숫자·문자열)까지 같아야 true
        console.log('3. 12 >= 12 →', 12 >= 12);          // 크거나 같다
        console.log('4. 12 > 12 →', 12 > 12);            // 크다(같으면 false)
        console.log("5. '10' > '9' →", '10' > '9');      // 문자열끼리는 첫 글자부터: '1' < '9'
        console.log("6. Number('10') > Number('9') →", Number('10') > Number('9'));  // 숫자로 바꾸면 10 > 9
    </script>
</body>
</html>
