<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex10 date</title>
</head>
<body>
    <h1>ex10 new Date(): 지금 시각을 담은 값</h1>
    <p>F12 › Console 에 1~6번이 찍힌다. 새로고침할 때마다 다시 잰다.</p>
    <ol>
        <li><code>now.getHours()</code> — 시, 0~23</li>
        <li><code>now.getMinutes()</code> — 분, 0~59</li>
        <li><code>now.getFullYear()</code> — 연도</li>
        <li><code>now.getMonth()</code> — 월. 0부터 센다(1월이 0)</li>
        <li><code>now.getMonth() + 1</code> — 사람이 읽는 월</li>
        <li><code>now.getDay()</code> — 요일, 0 = 일요일</li>
    </ol>
    <script>
        const now = new Date();     // 이 줄이 실행된 순간의 날짜·시각을 담은 값
        console.log('now :', now);
        console.log('1. now.getHours() →', now.getHours());     // 값에게 "몇 시야?"를 묻는다
        console.log('2. now.getMinutes() →', now.getMinutes());
        console.log('3. now.getFullYear() →', now.getFullYear());
        console.log('4. now.getMonth() →', now.getMonth());
        console.log('5. now.getMonth() + 1 →', now.getMonth() + 1);
        console.log('6. now.getDay() →', now.getDay());
        // web-week05 의 new Date().getHours() 는 위 두 줄(now 만들기 → getHours)을 한 줄로 이어 쓴 것이다
    </script>
</body>
</html>
