<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex10 date</title>
</head>
<body>
    <h1>ex10 new Date(): 지금 시각을 담은 값</h1>
    <table border="1">
        <tr><th>식</th><th>결과</th><th>뜻</th></tr>
        <tr><td>1. now.getHours()</td><td id="d1"></td><td>시, 0~23</td></tr>
        <tr><td>2. now.getMinutes()</td><td id="d2"></td><td>분, 0~59</td></tr>
        <tr><td>3. now.getFullYear()</td><td id="d3"></td><td>연도</td></tr>
        <tr><td>4. now.getMonth()</td><td id="d4"></td><td>월 — 0부터 센다(1월이 0)</td></tr>
        <tr><td>5. now.getMonth() + 1</td><td id="d5"></td><td>사람이 읽는 월</td></tr>
        <tr><td>6. now.getDay()</td><td id="d6"></td><td>요일, 0 = 일요일</td></tr>
    </table>
    <p>새로고침할 때마다 다시 잰다. my-web 인사말이 12시 전후로 바뀌는 이유가 1번이다.</p>

    <script>
        const now = new Date();     // 이 줄이 실행된 순간의 날짜·시각을 담은 값
        console.log(now);

        document.getElementById('d1').innerText = now.getHours();   // 값에게 "몇 시야?"를 묻는다
        document.getElementById('d2').innerText = now.getMinutes();
        document.getElementById('d3').innerText = now.getFullYear();
        document.getElementById('d4').innerText = now.getMonth();
        document.getElementById('d5').innerText = now.getMonth() + 1;
        document.getElementById('d6').innerText = now.getDay();
        // my-web 의 new Date().getHours() 는 위 두 줄(now 만들기 → getHours)을 한 줄로 이어 쓴 것이다
    </script>
</body>
</html>
