<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex01 click</title>
</head>
<body>
    <h1>ex01 지금 실행 vs 클릭할 때 실행</h1>
    <button id="btn">버튼</button>
    <p>F12 › Console 을 열고 A·B·C 가 찍히는 순서를 본다. 버튼을 여러 번 눌러 본다.</p>
    <script>
        console.log('A. 페이지를 열자마자 실행된다');
        // 버튼을 찾아(찾는 법은 ex09) 클릭할 때 할 일을 등록만 해 둔다
        document.getElementById('btn').addEventListener('click', function () {
            console.log('B. 버튼을 누를 때마다 실행된다');
        });
        console.log('C. A 바로 다음에 실행된다. B 보다 먼저');
        // 작년 예제는 function () { } 대신 () => { } 로 썼다. 여기서는 뜻이 같다
    </script>
</body>
</html>
