<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ex02 script 위치</title>
    <script>
        console.log('1. head 안 script :', document.body);
        let scriptResults = '1: ' + document.body;
    </script>
    <script src="app.js" defer></script>
</head>
<body>
    <h1>ex02 script 위치</h1>
    <button id="btn">실행 순서 확인</button>
    <p id="result" aria-live="polite">출력 대기 중</p>
    <script>
        console.log('2. body 끝 script :', document.body);
        scriptResults += ' → 2: body';
        // 제공 출력 코드: HTML을 모두 읽은 뒤 버튼을 연결한다.
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelector('#btn').addEventListener('click', function () {
                document.querySelector('#result').textContent = scriptResults;
            });
        });
    </script>
</body>
</html>
