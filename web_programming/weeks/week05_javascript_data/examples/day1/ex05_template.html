<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex05 template</title>
</head>
<body>
    <h1>ex05 문장 만들기: + 와 템플릿 문자열</h1>
    <p>F12 › Console 에 1~4번이 찍힌다.</p>
    <script>
        const name = 'student01';
        const hour = 9;
        console.log('1. + 로 잇기 :', '안녕하세요, ' + name + '님! 지금은 ' + hour + '시입니다.');
        console.log('2. 템플릿 문자열(백틱) :', `안녕하세요, ${name}님! 지금은 ${hour}시입니다.`);   // ` 로 감싼다
        console.log('3. 작은따옴표 안의 ${} :', '안녕하세요, ${name}님!');                         // ' 로 감싸면 ${} 가 글자 그대로
        console.log('4. ${} 안의 계산 :', `한 시간 뒤는 ${hour + 1}시입니다.`);                    // ${} 안은 계산된다
    </script>
</body>
</html>
