<!-- ex09 SVG 도형: 그림을 글자로 적은 파일이다. 도형 하나가 태그 하나다 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" width="420" height="150" font-family="sans-serif">
  <!-- 흰 배경: 없으면 GitHub 어두운 화면에서 검은 글자가 안 보인다 -->
  <rect x="0" y="0" width="420" height="150" fill="white"/>
  <!-- 사각형: x·y 왼쪽 위 자리, width·height 크기, fill 안쪽 색, stroke 테두리 색 -->
  <rect x="20" y="20" width="120" height="60" fill="#e8f1ff" stroke="#3366cc"/>
  <!-- 선: x1·y1 에서 x2·y2 까지 -->
  <line x1="140" y1="50" x2="260" y2="50" stroke="#3366cc" stroke-width="2"/>
  <!-- 글자: x·y 글자 자리, font-size 크기, fill 글자 색 -->
  <text x="20" y="120" font-size="20" fill="#222222">SVG 는 글자로 그린 그림</text>
</svg>
