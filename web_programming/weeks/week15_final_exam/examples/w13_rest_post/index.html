<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>POST로 서버 방명록 저장</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/w3-css/4.1.0/w3.min.css">
<script src="api-settings.js" defer></script><script src="app.js" defer></script></head>
<body><main class="w3-content w3-padding"><h1>POST로 서버 방명록 저장</h1><details><summary>API 설정</summary>
<form id="api-settings-form">
<p><label for="api-base-url">API 주소</label><input id="api-base-url" type="url" required></p>
<p><label for="api-public-key">공개 키</label><input id="api-public-key" type="password" autocomplete="off" required></p>
<p><label for="api-book-id">방명록 번호</label><input id="api-book-id" pattern="[a-z0-9_-]{1,40}" required></p>
<button class="w3-button w3-teal" type="submit">설정 적용</button><p id="api-settings-notice" role="status"></p></form></details><form id="guestbook-form"><label for="name">이름</label><input class="w3-input w3-border" id="name" maxlength="30"><label for="message">메시지</label><textarea class="w3-input w3-border" id="message" rows="3" maxlength="500"></textarea><button class="w3-button w3-teal" type="submit">남기기</button></form><p id="notice" role="status"></p><ul class="w3-responsive" id="list"></ul><button class="w3-button w3-white w3-border" id="reload" type="button">목록 확인</button></main></body></html>
