<!DOCTYPE html>

<body>
    <h1>10주차 1일차 예제: script 줄 하나만 켠다</h1>
    <p>이 파일 맨 아래 script 줄 네 개 중 <b>하나만</b> 주석 밖에 둔다. 저장 → 새로고침 → 화면과 F12 › Console 을 본다.</p>
    <p>예제 코드는 각 <code>exNN_*.js</code> 파일에 있다. ex01·ex02 는 Console 에만 찍고, ex03·ex04 는 아래 자리도 쓴다.</p>

    <h2>예제가 쓰는 자리</h2>
    <div>
        <label for="text">글</label>
        <input id="text" value="student01: 안녕하세요">
        <button id="add">더하기</button>
    </div>
    <ul id="list"></ul>
    <div id="count">0개</div>

    <!-- 예제 고르기: 줄에 커서를 두고 Ctrl+/ (macOS ⌘+/) 를 누르면 주석이 켜지고 꺼진다. 한 줄만 켠다 -->
    <script src="ex01_array.js"></script>
