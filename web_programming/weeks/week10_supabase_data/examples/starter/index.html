<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Supabase Public Read Starter</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="./js/main.js"></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">WEEK 10 · PUBLISHABLE CLIENT</p>
        <h1>공개 학습 글</h1>
        <p>RLS가 허용한 published 행만 읽습니다.</p>
      </header>

      <section id="result" aria-busy="false" aria-labelledby="result-title">
        <div class="section-heading">
          <h2 id="result-title">목록</h2>
          <button id="reload-button" type="button">다시 불러오기</button>
        </div>
        <p id="status" role="status" aria-live="polite">설정을 확인하는 중입니다.</p>
        <ul id="post-list"></ul>
      </section>
    </main>
  </body>
</html>
