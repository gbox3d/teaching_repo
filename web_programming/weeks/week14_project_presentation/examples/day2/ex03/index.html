<!doctype html>
<html lang="ko"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PATCH와 결과 재조회</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/w3-css/4.1.0/w3.min.css">
  <script src="config.example.js" defer></script><script src="app.js" defer></script>
</head><body><main class="w3-content w3-container">
<h1>PATCH와 결과 재조회</h1>
<p><button class="w3-button w3-small w3-border" id="key-clear-button" type="button">공개 키 지우기</button></p>
<form id="request-form" autocomplete="off">
  <label for="id">내 연습 글 ID</label><input class="w3-input w3-border" id="id" type="number" min="1" step="1" required>
  <label for="message">수정 메시지</label><input class="w3-input w3-border" id="message" maxlength="500" required>
  <button class="w3-button w3-teal" id="send" type="submit">수정 요청</button>
</form><div id="notice" role="status"></div><pre id="result" class="w3-responsive"></pre>
</main></body></html>
