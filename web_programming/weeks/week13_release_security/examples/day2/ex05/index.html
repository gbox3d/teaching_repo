<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ex05 · 저장 중 버튼</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/w3-css/4.1.0/w3.min.css">
  <script src="config.example.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="w3-content w3-padding">
    <h1>저장 중 버튼</h1>
    <p><button class="w3-button w3-small w3-border" id="key-clear-button" type="button">공개 키 지우기</button></p>
    <form id="example-form">
      <p><label for="message">메시지</label>
        <input class="w3-input w3-border" id="message" maxlength="500" required></p>
      <button class="w3-button w3-teal" id="send-button" type="submit">저장</button>
    </form>
    <pre class="w3-responsive" id="output" role="status"></pre>
  </main>
</body>
</html>
