<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ex04 · 폼 입력 POST</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/w3-css/4.1.0/w3.min.css">
  <script src="api-settings.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="w3-content w3-padding">
    <h1>폼 입력 POST</h1>
    <details class="w3-margin-bottom" open>
      <summary>API 설정</summary>
      <form id="api-settings-form" autocomplete="off">
        <p><label for="api-base-url">API 주소</label><input id="api-base-url" type="url" value="https://esoqbcwgzjtwcqszwvin.supabase.co" required></p>
        <p><label for="api-public-key">공개 키</label><input id="api-public-key" type="password" autocomplete="off" required></p>
        <p><label for="api-book-id">방명록 번호</label><input id="api-book-id" pattern="[a-z0-9_-]{1,40}" required></p>
        <button class="w3-button w3-teal" type="submit">설정 적용</button>
        <p id="api-settings-notice" role="status">배부받은 공개 키를 입력하고 설정을 적용하세요.</p>
      </form>
    </details>
    <form id="example-form">
      <p><label for="message">메시지</label>
        <input class="w3-input w3-border" id="message" maxlength="500" required></p>
      <button class="w3-button w3-teal" id="send-button" type="submit" disabled>저장</button>
    </form>
    <pre class="w3-responsive" id="output" role="status"></pre>
  </main>
</body>
</html>
