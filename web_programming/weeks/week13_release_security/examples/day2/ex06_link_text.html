<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex06 링크·버튼 글자</title>
</head>
<body>
    <h1>ex06 링크·버튼 글자: 그 글자만 읽어도 무엇인지 알게 쓴다</h1>
    <p>맨 위 제목 글자를 한 번 누르고 키보드 Tab 키를 여러 번 누른다. 링크와 버튼에 차례로 테두리가 생긴다. 테두리가 생긴 것의 글자만 읽어 본다.</p>
    <p>이 예제의 버튼은 누를 일이 없다. 글자만 비교한다.</p>
    <h2>1. 세 링크가 같은 글자</h2>
    <div>
        <a href="https://developer.mozilla.org/ko/docs/Web/HTML/Reference/Elements/img">페이지 열기</a>
        <a href="https://developer.mozilla.org/ko/docs/Web/HTML/Reference/Elements/label">페이지 열기</a>
        <a href="https://developer.mozilla.org/ko/docs/Web/HTML/Reference/Elements/a">페이지 열기</a>
    </div>
    <h2>2. 어디로 가는지 적은 글자</h2>
    <div>
        <a href="https://developer.mozilla.org/ko/docs/Web/HTML/Reference/Elements/img">img 설명 열기</a>
        <a href="https://developer.mozilla.org/ko/docs/Web/HTML/Reference/Elements/label">label 설명 열기</a>
        <a href="https://developer.mozilla.org/ko/docs/Web/HTML/Reference/Elements/a">a 설명 열기</a>
    </div>
    <h2>3. 버튼 글자 — 기호 하나 / 하는 일</h2>
    <div>
        <button type="button">▶</button>
        <button type="button">계산하기</button>
    </div>
</body>
</html>
