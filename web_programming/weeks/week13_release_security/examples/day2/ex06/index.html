<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ex06 · POST 뒤 GET</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/w3-css/4.1.0/w3.min.css">
  <script src="config.example.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="w3-content w3-padding">
    <h1>POST 뒤 GET</h1>
    <p><button class="w3-button w3-small w3-border" id="key-clear-button" type="button">공개 키 지우기</button></p>
    <button class="w3-button w3-teal" id="run-button" type="button">저장 요청</button>
    <pre class="w3-responsive" id="output" role="status"></pre>
    <h2>서버 목록</h2>
    <button class="w3-button w3-teal" id="reload-button" type="button">새로 불러오기</button>
    <p id="load-notice" role="status"></p>
    <ul class="w3-ul w3-responsive" id="list"></ul>
  </main>
</body>
</html>
