<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>13주차 1일차 예제</title>
</head>
<body>
    <h1>13주차 1일차 예제: script 줄 하나만 켠다</h1>
    <p>이 파일 맨 아래 script 줄 두 개 중 <b>하나만</b> 주석 밖에 둔다. 저장 → 새로고침 → 칸에 연도를 적고 버튼을 누른 뒤 화면과 F12 › Console 을 본다.</p>
    <p>예제 코드는 각 <code>exNN_*.js</code> 파일에 있다. 두 예제가 아래 자리를 함께 쓴다.</p>

    <h2>예제가 쓰는 자리</h2>
    <div>
        <label for="year">입학 연도</label>   <!-- label for 는 3주차 폼. 이름표가 칸에 이어지는지는 ex05 -->
        <input id="year" type="text" value="2023">
        <button id="btn">눌러 보기</button>
    </div>
    <div id="result">결과 자리 — 버튼을 누르면 바뀐다</div>

    <!-- 예제 고르기: 줄에 커서를 두고 Ctrl+/ (macOS ⌘+/) 를 누르면 주석이 켜지고 꺼진다. 한 줄만 켠다 -->
    <script src="ex01_number.js"></script>
    <!-- <script src="ex02_year.js"></script> -->
</body>
</html>
