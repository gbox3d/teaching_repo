<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex04 alt</title>
</head>
<body>
    <h1>ex04 alt: 그림이 안 보일 때 대신 읽히는 글</h1>
    <p>세 그림은 같은 파일이라 눈으로는 똑같다. F12 › Elements 에서 img 줄마다 alt 를 비교한다.</p>
    <p>그림 파일은 같은 폴더의 <code>images/profile.png</code> 다. 세 src 를 모두 <code>images/nothing.png</code> 로 바꾸면 그림 자리마다 무엇이 남는지 본다.</p>
    <h2>1. alt 에 무슨 그림인지 적었다</h2>
    <img src="images/profile.png" alt="student01의 프로필 그림" width="160">
    <h2>2. alt 가 없다</h2>
    <img src="images/profile.png" width="160">
    <h2>3. alt 에 '그림' 한 낱말만 적었다</h2>
    <img src="images/profile.png" alt="그림" width="160">
</body>
</html>
