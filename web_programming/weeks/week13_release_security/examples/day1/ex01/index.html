<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex01 number</title>
    <script src="app.js" defer></script>
</head>
<body>
    <h1>ex01 Number() 와 isNaN(): 글자를 숫자로 바꾼다</h1>
    <p>칸에 2023 · 이천이십삼 · 2023년 · (빈칸) 을 차례로 적고 눌러 보기를 누른다. F12 › Console 의 1·2·3번은 버튼을 누를 때 찍힌다. 결과 자리의 글자와 함께 비교한다.</p>
    <div>
        <label for="year">입학 연도</label>   <!-- label for 는 3주차 폼. 이름표가 칸에 이어지는지는 ex05 -->
        <input id="year" type="text" value="2023">
        <button id="btn">눌러 보기</button>
    </div>
    <div id="result">결과 자리 — 버튼을 누르면 바뀐다</div>
</body>
</html>
