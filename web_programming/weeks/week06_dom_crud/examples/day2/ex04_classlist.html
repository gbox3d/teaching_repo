<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex04 classList</title>
    <style>
        .on {
            background-color: gold;    /* class="on" 이 붙은 동안만 노란 배경 */
        }
    </style>
</head>
<body>
    <h1>ex04 classList: class 를 붙이고 떼기</h1>
    <p>버튼을 누르며 화면의 상자와 F12 › Elements 의 <code>&lt;div id="box"&gt;</code> 줄(class 가 생기고 사라진다)을 함께 본다.</p>
    <div id="box">상자</div>
    <div>
        <button id="btn-add">1. add</button>
        <button id="btn-remove">2. remove</button>
        <button id="btn-toggle">3. toggle</button>
    </div>
    <script src="ex04_classlist.js"></script>
</body>
</html>
