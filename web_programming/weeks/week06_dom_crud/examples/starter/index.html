<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DOM CRUD Starter</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main class="app">
      <header>
        <p class="eyebrow">WEEK 06</p>
        <h1>오늘의 할 일</h1>
        <p>상태를 먼저 바꾸고 화면을 다시 그려 보세요.</p>
      </header>

      <form id="todo-form">
        <label for="todo-title">할 일</label>
        <div class="input-row">
          <input id="todo-title" name="title" maxlength="60" autocomplete="off">
          <button type="submit">추가</button>
        </div>
      </form>

      <p id="status" role="status" aria-live="polite">starter가 준비되었습니다.</p>
      <p id="empty-message">아직 항목이 없습니다.</p>
      <ul id="todo-list" aria-label="할 일 목록"></ul>
    </main>
  </body>
</html>
