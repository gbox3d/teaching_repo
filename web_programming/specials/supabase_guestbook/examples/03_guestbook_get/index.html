<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>03 · 방명록 목록 조회</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.example.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header><p>03 · GET /rest/v1/guestbook</p><h1>방명록 목록 조회</h1>
    <p>book_id 필터로 태그가 같은 글만 읽습니다. 이 단계에서는 데이터를 변경하지 않습니다.</p></header>
  <main>
    <section>
      <h2>조회 조건과 목록</h2>
      <form id="read-form">
        <label for="book">방명록 태그</label>
        <input id="book" required pattern="[a-z0-9_-]{1,40}" maxlength="40">
        <div class="buttons"><button id="load" type="submit">목록 조회</button></div>
      </form>
      <p id="notice" role="status">요청 대기</p>
      <ul id="messages"></ul>
    </section>
    <section>
      <h2>요청과 응답</h2>
      <p id="api-address"></p>
      <p id="response-status">응답 대기</p>
      <pre id="response-body">응답 없음</pre>
      <p>eq.는 같은 값을 뜻합니다. 빈 배열 []은 조회된 글이 없다는 뜻입니다.</p>
    </section>
  </main>
  <footer><p>API 주소와 공개 키는 이 폴더의 config.example.js에서 설정합니다.</p>
    <p><a href="requests.http">REST Client 요청 파일</a> · <a href="app.js">JavaScript 소스</a></p></footer>
</body>
</html>
