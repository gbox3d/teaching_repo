<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>04 · 새 글 저장</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.example.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header><p>04 · POST /rest/v1/guestbook</p><h1>새 글 저장</h1>
    <p>입력값을 JSON으로 보내고 GET으로 저장된 글을 확인합니다. 같은 내용을 다시 POST하면 새 글이 추가됩니다.</p></header>
  <main>
    <section>
      <h2>새 글 입력</h2>
      <form id="write-form">
        <fieldset id="entry-fields">
          <legend>방명록 입력값</legend>
          <label for="book">방명록 태그</label>
          <input id="book" required pattern="[a-z0-9_-]{1,40}" maxlength="40">
          <label for="name">별칭</label>
          <input id="name" required maxlength="30" autocomplete="off">
          <label for="message">메시지</label>
          <textarea id="message" required maxlength="500" rows="4"></textarea>
          <div class="buttons"><button type="submit">새 글 저장</button></div>
        </fieldset>
      </form>
      <p id="notice" role="status">요청 대기</p>
      <p>태그는 강의자가 미리 등록한 값을 사용하세요. id와 created_at은 서버가 생성합니다.</p>
    </section>
    <section>
      <h2>저장 결과와 목록</h2>
      <p id="api-address"></p>
      <p id="response-status">응답 대기</p>
      <pre id="response-body">응답 없음</pre>
      <button id="load" type="button">목록 조회</button>
      <ul id="messages"></ul>
    </section>
  </main>
  <footer><p>API 주소와 공개 키는 이 폴더의 config.example.js에서 설정합니다.</p>
    <p><a href="requests.http">REST Client 요청 파일</a> · <a href="app.js">JavaScript 소스</a></p></footer>
</body>
</html>
