<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>04 · 새 글 저장</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/w3-css/4.1.0/w3.min.css">
  <script src="config.example.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body class="w3-content w3-padding">
  <header><p>04 · POST /rest/v1/guestbook</p><h1>새 글 저장</h1>
    </header>
  <main>
    <section class="w3-card w3-container w3-margin-bottom">
      <h2>새 글 입력</h2>
      <form id="write-form">
        <fieldset id="entry-fields">
          <legend>방명록 입력값</legend>
          <label for="book">방명록 태그</label>
          <input class="w3-input w3-border" id="book" required pattern="[a-z0-9_-]{1,40}" maxlength="40">
          <label for="name">별칭</label>
          <input class="w3-input w3-border" id="name" required maxlength="30" autocomplete="off">
          <label for="message">메시지</label>
          <textarea class="w3-input w3-border" id="message" required maxlength="500" rows="4"></textarea>
          <div class="w3-section"><button class="w3-button w3-teal" type="submit">새 글 저장</button></div>
        </fieldset>
      </form>
      <p id="notice" role="status">요청 대기</p>

    </section>
    <section class="w3-card w3-container w3-margin-bottom">
      <h2>저장 결과와 목록</h2>
      <p id="api-address" class="w3-responsive"></p>
      <p id="response-status">응답 대기</p>
      <pre id="response-body" class="w3-responsive">응답 없음</pre>
      <button class="w3-button w3-white w3-border" id="load" type="button">목록 조회</button>
      <ul id="messages" class="w3-responsive"></ul>
    </section>
  </main>
  <footer>
    <p><a href="requests.http">REST Client 요청 파일</a> · <a href="app.js">JavaScript 소스</a></p></footer>
</body>
</html>
