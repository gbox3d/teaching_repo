<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>01 · API 접속 확인</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/w3-css/4.1.0/w3.min.css">
  <script src="config.example.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body class="w3-content w3-padding">
  <header><p>01 · GET /rest/v1/about</p><h1>API 접속 확인</h1>
    </header>
  <main>
    <section class="w3-card w3-container w3-margin-bottom">
      <h2>요청</h2>
      <p id="api-address" class="w3-responsive"></p>

      <button class="w3-button w3-white w3-border" id="load" type="button">접속 확인</button>
      <p id="notice" role="status">요청 대기</p>
    </section>
    <section class="w3-card w3-container w3-margin-bottom">
      <h2>응답</h2>
      <p id="response-status">응답 대기</p>
      <pre id="response-body" class="w3-responsive">응답 없음</pre>

    </section>
  </main>
  <footer>
    <p><a href="requests.http">REST Client 요청 파일</a> · <a href="app.js">JavaScript 소스</a></p></footer>
</body>
</html>
