<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수업 방명록</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/w3-css/4.1.0/w3.min.css">
  <script src="config.example.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body class="w3-content w3-padding">
  <header>
    <p>07 · SUPABASE GUESTBOOK</p>
    <h1>수업 방명록</h1>
    <p><button class="w3-button w3-small w3-border" id="key-clear-button" type="button">공개 키 지우기</button></p>

    <form id="book-form">
      <label for="book">방명록 태그</label>
      <input class="w3-input w3-border" id="book" required pattern="[a-z0-9_-]{1,40}" maxlength="40" aria-describedby="book-help">
      <p id="book-help">등록된 태그 사용</p>
      <div class="w3-section"><button class="w3-button w3-teal" id="load" type="submit">목록 새로고침</button></div>
    </form>
    <p id="notice" role="status" aria-live="polite">목록 조회 대기</p>
  </header>
  <main>
    <section class="w3-card w3-container w3-margin-bottom" aria-labelledby="write-title">
      <h2 id="write-title">새 글 작성</h2>
      <form id="write-form">
        <label for="name">별칭</label>
        <input class="w3-input w3-border" id="name" required maxlength="30" autocomplete="off">
        <label for="message">메시지</label>
        <textarea class="w3-input w3-border" id="message" required maxlength="500" rows="5"></textarea>
        <div class="w3-section"><button class="w3-button w3-teal" id="post" type="submit">글 등록</button></div>
      </form>
      <div id="edit-panel" hidden>
        <hr>
        <h2>선택한 글 편집</h2>
        <p id="selection"></p>
        <form id="edit-form">
          <label for="edit-name">별칭</label>
          <input class="w3-input w3-border" id="edit-name" required maxlength="30" autocomplete="off">
          <label for="edit-message">메시지</label>
          <textarea class="w3-input w3-border" id="edit-message" required maxlength="500" rows="5"></textarea>

          <div class="w3-section">
            <button class="w3-button w3-teal" id="patch" type="submit">수정 저장</button>

            <button class="w3-button w3-white w3-border" id="cancel-edit" type="button">편집 취소</button>
          </div>
        </form>
      </div>
    </section>
    <section class="w3-card w3-container w3-margin-bottom" aria-labelledby="list-title">
      <h2 id="list-title">방명록 글</h2>
      <p id="list-summary">목록 조회 대기</p>
      <ul id="messages" class="w3-responsive"></ul>

    </section>
  </main>
  <footer>

    <p><a href="requests.http">REST Client 요청 예제</a> · <a href="app.js">JavaScript 소스</a></p>
  </footer>
</body>
</html>
