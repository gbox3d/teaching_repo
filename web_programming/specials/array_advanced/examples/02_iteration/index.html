<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>배열 순회</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/w3-css/4.1.0/w3.min.css">
    <script src="app.js" defer></script>
</head>
<body class="w3-content w3-padding">
    <h1>배열 순회</h1>
    <h2>원본 배열</h2>
    <pre class="w3-responsive" id="source-json"></pre>
    <button class="w3-button w3-border w3-round" id="for-of" type="button">for...of 실행</button>
    <button class="w3-button w3-border w3-round" id="for-each" type="button">forEach 실행</button>
    <h2>순회 결과</h2>
    <ul id="result-list"></ul>
    <h2>반환값</h2>
    <pre class="w3-responsive" id="return-output">실행 전</pre>
    <h2>실행 후 원본</h2>
    <pre class="w3-responsive" id="after-json">실행 전</pre>
    <p id="status" role="status">대기</p>
</body>
</html>
