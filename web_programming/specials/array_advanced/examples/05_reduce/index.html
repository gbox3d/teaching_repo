<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열 05 reduce 점수 합계</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/w3-css/4.1.0/w3.min.css">
    <script src="app.js" defer></script>
</head>
<body class="w3-content w3-padding">
    <main>
        <h1>배열 05 reduce 점수 합계</h1>
        <label for="empty-array"><input class="w3-check" id="empty-array" type="checkbox"> 빈 배열</label>
        <button class="w3-button w3-border w3-round" id="run-button" type="button">합계 계산</button>
        <h2>원본 배열</h2>
        <pre class="w3-responsive" id="original"></pre>
        <h2>계산 결과</h2>
        <p>계산 대상: <output id="input-summary">실행 전</output></p>
        <p>합계: <output id="sum">—</output> · 콜백 호출: <output id="calls">—</output></p>
        <table class="w3-table-all">
            <caption>콜백 실행 기록 · 초깃값 0</caption>
            <thead><tr><th scope="col">단계</th><th scope="col">누적값</th><th scope="col">현재 점수</th><th scope="col">다음 값</th></tr></thead>
            <tbody id="steps"></tbody>
        </table>
        <p id="status" role="status">대기</p>
    </main>
</body>
</html>
