<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>홈 · 두 화면</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/w3-css/4.1.0/w3.min.css">
  <link rel="stylesheet" href="shared/examples.css">
  <script src="app.js" defer></script>
</head>
<body class="w3-light-grey">
<header class="w3-container w3-teal"><h1>나의 웹 연습장</h1></header>
<nav class="w3-bar w3-white w3-card" aria-label="화면 선택">
<button class="w3-bar-item w3-button w3-mobile" type="button" data-screen="home">홈</button>
<button class="w3-bar-item w3-button w3-mobile" type="button" data-screen="about">내 정보</button>
</nav>
<main class="teaching-example w3-content w3-padding">
<section class="w3-white" id="home">
<h2 tabindex="-1">홈</h2>
<p>웹프로그래밍을 배우는 student01입니다.</p>
<button id="home-count-button" class="w3-button w3-teal" type="button">횟수 증가</button>
<p id="home-count" role="status">클릭 0회</p>
</section>
<section class="w3-white" id="about" hidden>
<h2 tabindex="-1">내 정보</h2>
<p>student01 · 웹 페이지 만들기</p>
<p>관심 분야: 사진, 보드게임, 산책</p>
</section>
</main>
<footer class="w3-container w3-center w3-text-grey"><p>수업용 연습 페이지 · 별칭만 사용하세요.</p></footer>
</body>
</html>
