<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>홈 · Hash SPA</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/w3-css/4.1.0/w3.min.css">
  <script src="app.js" defer></script>
</head>
<body class="w3-light-grey">
<header class="w3-container w3-teal"><h1>나의 웹 연습장</h1></header>
<nav class="w3-bar w3-white w3-card" aria-label="주 메뉴">
<a class="w3-bar-item w3-button w3-mobile" href="#home" data-route="home">홈</a>
<a class="w3-bar-item w3-button w3-mobile" href="#about" data-route="about">내 정보</a>
<a class="w3-bar-item w3-button w3-mobile" href="#guestbook" data-route="guestbook">방명록</a>
</nav>
<main class="w3-content w3-padding">
<section class="w3-white w3-padding" id="home">
<h2 tabindex="-1">홈</h2>
<p>웹프로그래밍을 배우는 student01입니다.</p>
<button id="home-count-button" class="w3-button w3-teal" type="button">횟수 증가</button>
<p id="home-count" role="status">클릭 0회</p>
</section>
<section class="w3-white w3-padding" id="about" hidden>
<h2 tabindex="-1">내 정보</h2>
<p>student01 · 웹 페이지 만들기</p>
<p>관심 분야: 사진, 보드게임, 산책</p>
</section>
<section class="w3-white w3-padding" id="guestbook" hidden>
<h2 tabindex="-1">방명록</h2>
<form id="guestbook-form">
  <p><label for="name">이름(별칭)</label><input id="name" class="w3-input w3-border" maxlength="30" required></p>
  <p><label for="message">메시지</label><textarea id="message" class="w3-input w3-border" rows="3" maxlength="500" required></textarea></p>
  <button class="w3-button w3-teal" type="submit">미리 보기</button>
</form>
<p id="notice" class="w3-responsive" role="status"></p>
</section>
<section class="w3-white w3-padding" id="not-found" hidden>
<h2 tabindex="-1">화면을 찾을 수 없습니다</h2>
<p>주소를 확인하세요.</p><a href="#home">홈으로 이동</a>
</section>
</main>
<footer class="w3-container w3-center w3-text-grey"><p>수업용 연습 페이지 · 별칭만 사용하세요.</p></footer>
</body>
</html>
