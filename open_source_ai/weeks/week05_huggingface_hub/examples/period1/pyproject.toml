[project]
name = "osa-week05-period1"
version = "0.1.0"
description = "오픈소스 AI 응용 5주차 1교시 실습"
requires-python = ">=3.12"
dependencies = [
  "huggingface_hub>=0.34",
]

# uv sync 가 .venv 에 명령을 만든다: uv run ex01 → ex01 패키지의 main() 실행
[project.scripts]
ex01 = "ex01:main"
ex02 = "ex02:main"
ex03 = "ex03:main"

# 이 프로젝트를 패키지로 빌드·설치하는 도구. 없으면 위 명령이 만들어지지 않는다.
[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

# src/ 아래 패키지 이름. 기본값(프로젝트 이름 osa_week05_period1)과 다르므로 적는다.
[tool.uv.build-backend]
module-name = ["ex01", "ex02", "ex03"]
