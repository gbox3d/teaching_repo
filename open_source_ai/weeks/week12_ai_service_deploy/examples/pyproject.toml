[project]
name = "osa-week12-control"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["bleuno-control[train]"]

[project.scripts]
ex01 = "ex01_data:main"
ex02 = "ex02_train:main"
ex03 = "ex03_restore:main"

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["ex01_data","ex02_train","ex03_restore","shared"]

[tool.uv.sources]
bleuno-control = { path = "../../../../tools/bleuno-control", editable = true }
