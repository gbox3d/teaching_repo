[project]
name = "osa-week03-oss-tool"
version = "0.1.0"
description = "오픈소스 AI 응용 3주차 예제 — 재현 가능한 CLI 프로젝트 골격"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx",
  "python-dotenv",
]

# 명령 이름 = "패키지.모듈:함수". `uv sync`가 .venv\Scripts\oss-tool.exe 를 만든다.
[project.scripts]
oss-tool = "oss_tool.cli:main"

# src 레이아웃 패키지를 .venv 에 편집 가능 설치하려면 빌드 백엔드가 필요하다.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 프로젝트 이름(osa-week03-oss-tool)과 패키지 이름(oss_tool)이 다르므로 위치를 직접 알려 준다.
[tool.hatch.build.targets.wheel]
packages = ["src/oss_tool"]
