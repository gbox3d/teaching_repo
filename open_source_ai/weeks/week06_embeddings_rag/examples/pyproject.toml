[project]
name = "osa-week06-rag"
version = "0.1.0"
description = "임베딩 검색과 RAG로 만드는 그리스·로마 신화 도우미"
requires-python = ">=3.12"
dependencies = ["langchain-core", "langchain-ollama", "langchain-text-splitters", "numpy"]

[project.scripts]
ex01 = "ex01_embed:main"
ex02 = "ex02_search:main"
ex03 = "ex03_compare:main"
ex04 = "ex04_rag_chat:main"
ex05 = "ex05_chunk:main"
ex06 = "ex06_my_docs:main"

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["ex01_embed", "ex02_search", "ex03_compare", "ex04_rag_chat", "ex05_chunk", "ex06_my_docs", "shared"]
