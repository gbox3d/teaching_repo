[project]
name = "osa-week11-control"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["bleuno-control[needle]"]

[project.scripts]
ex01 = "ex01_needle:main"
ex02 = "ex02_compare:main"
ex03 = "ex03_descriptions:main"

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["ex01_needle","ex02_compare","ex03_descriptions","shared"]

[tool.uv.sources]
bleuno-control = { path = "../../../../tools/bleuno-control", editable = true }
