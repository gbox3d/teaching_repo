# 13주차 CI — push·PR 마다 깨끗한 가상 머신에서 lint → format 검사 → 테스트를 돈다.
# 이 파일은 저장소 루트의 .github/workflows/ 안에 있어야 GitHub 가 인식한다.
# 프로젝트가 저장소의 하위 폴더에 있으면 `defaults.run.working-directory` 를 그 폴더로 둔다.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 토큰 권한은 필요한 최소로 둔다. 코드를 읽기만 하면 된다.
permissions:
  contents: read

# 같은 브랜치에 새 push 가 오면 이전 실행을 취소한다(실행 시간 절약).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 액션의 메이저 버전은 학기별 환경 기준표에서 확정한다.
      - name: uv 설치 (패키지 캐시 사용)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Python 설치 (pyproject 의 requires-python 기준)
        run: uv python install

      # uv.lock 을 커밋한 저장소(3주차 이후 기본)는 `uv sync --locked` 로 바꿔
      # lock 과 pyproject 가 어긋나면 실패하게 한다. `--frozen` 은 검사하지 않고 lock 그대로
      # 설치하므로 어긋나도 통과한다. 이 예제 폴더에는 lock 을 두지 않으므로 plain sync.
      - name: 의존성 설치 (dev 그룹 포함)
        run: uv sync

      - name: ruff lint
        run: uv run ruff check .

      - name: ruff format 검사
        run: uv run ruff format --check .

      - name: pytest (integration 마커 제외)
        run: uv run pytest -q

  audit:
    # 취약점 DB 조회에 네트워크가 필요하고, 새 취약점이 등록되면 코드를 바꾸지 않아도 실패한다.
    # 그래서 별도 잡으로 두고 실패해도 test 잡의 초록불에는 영향을 주지 않는다.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync
      - name: 의존성 목록 내보내기
        run: uv export --format requirements-txt --no-hashes -o requirements-audit.txt
      - name: pip-audit
        run: uv run pip-audit -r requirements-audit.txt --no-deps
